[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-risk-ml"
version = "0.1.0"
description = "RAIL-designed release risk scoring service: deterministic rules first, model only for ambiguous cases."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["release_risk_ml*"]
