name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "release_risk_ml/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/py/rail _site/py/training _site/py/monitoring
          cp site/index.html _site/
          cp release_risk_ml/__init__.py release_risk_ml/schemas.py _site/py/
          cp release_risk_ml/rail/*.py _site/py/rail/
          cp release_risk_ml/training/__init__.py release_risk_ml/training/generate_data.py _site/py/training/
          cp release_risk_ml/monitoring/*.py _site/py/monitoring/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
